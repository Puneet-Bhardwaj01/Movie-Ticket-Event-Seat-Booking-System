{% extends "base.html" %}{% block content %}<div class="auth-card mx-auto"><h2>Create your account</h2><p class="text-secondary">Join SeatSpark to book seats.</p>
<form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
<button class="btn btn-primary w-100">Register</button></form><p class="small mt-3">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div>{% endblock %}
